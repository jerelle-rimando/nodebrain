appId: com.nodebrain.app
productName: NodeBrain
copyright: Copyright © 2026 Jerelle Rimando

asar: false
forceCodeSigning: false

directories:
  output: dist-electron
  buildResources: electron/assets

files:
  - electron/dist/**/*
  - electron/wizard/**/*
  - electron/splash/**/*
  - electron/assets/**/*
  - node_modules/**/*
  - "!node_modules/.cache"
  - "!**/*.map"

extraResources:
  - from: frontend/dist
    to: frontend/dist
  - from: electron/wizard
    to: electron/wizard
  - from: electron/splash
    to: electron/splash
  - from: electron/assets
    to: electron/assets
  # Telemetry endpoint + shared secret, read at runtime (not compiled in) so it
  # can be changed without a rebuild — see electron/telemetrySender.ts.
  - from: electron/telemetry-config.json
    to: telemetry-config.json
  - from: backend/dist
    to: backend/dist
  - from: backend/node_modules
    to: backend/node_modules
    filter:
      - "**/*"
      - "!nodebrain"
      - "!nodebrain/**"
      - "!**/*.map"
      - "!@types"
      - "!@types/**"
      - "!pm2"
      - "!pm2/**"
      - "!ts-node"
      - "!ts-node/**"
      - "!tsx"
      - "!tsx/**"
      - "!typescript"
      - "!typescript/**"
      - "!esbuild"
      - "!esbuild/**"
      - "!@esbuild"
      - "!@esbuild/**"
  - from: backend/package.json
    to: backend/package.json
  # Pinned npm + node shim so the built-in MCP servers run with no system
  # Node.js (see backend/src/mcp/nodeRuntime.ts). Installed by install:all.
  - from: vendor/npm-runtime/node_modules/npm
    to: npm
  # Listed on its own: electron-builder silently drops a nested node_modules
  # from the entry above, and npm can't run without its bundled dependencies.
  - from: vendor/npm-runtime/node_modules/npm/node_modules
    to: npm/node_modules
  - from: vendor/node-shim
    to: node-shim

win:
  icon: electron/assets/icon.ico
  target:
    - target: nsis
      arch: x64
    - target: portable
      arch: x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NodeBrain
  # No spaces: latest.yml references this exact name, and GitHub turns spaces in
  # uploaded asset names into dots, which 404s every auto-update download.
  artifactName: ${productName}-Setup-${version}.${ext}

portable:
  artifactName: NodeBrain-${version}-portable.exe

publish:
  provider: github
  owner: jerelle-rimando
  repo: nodebrain